<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>WorkSphere | Premium Freelance & Service Platform</title>
</head>

<body>
  <div id="root"></div>
  <script>
    window.addEventListener('vite:preloadError', () => {
      window.location.reload();
    });
    window.addEventListener('error', (e) => {
      if (e?.target?.tagName === 'SCRIPT' || (e?.message && e.message.includes('dynamically imported module'))) {
        const lastReload = sessionStorage.getItem('last_bundle_reload');
        const now = Date.now();
        if (!lastReload || now - Number(lastReload) > 5000) {
          sessionStorage.setItem('last_bundle_reload', String(now));
          window.location.reload();
        }
      }
    }, true);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
