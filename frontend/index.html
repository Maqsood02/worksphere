<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>WorkSphere | Premium Freelance & Service Platform</title>
  <script>
    // Automatic stale chunk recovery & auto-refresh on new deployment
    window.addEventListener('vite:preloadError', function () {
      window.location.href = window.location.pathname + '?_v=' + Date.now();
    });
    window.addEventListener('error', function (e) {
      if (e?.target?.tagName === 'SCRIPT' || (e?.message && (e.message.includes('dynamically imported module') || e.message.includes('Failed to load resource')))) {
        var lastReload = sessionStorage.getItem('last_stale_reload');
        var now = Date.now();
        if (!lastReload || now - Number(lastReload) > 3000) {
          sessionStorage.setItem('last_stale_reload', String(now));
          window.location.href = window.location.pathname + '?_v=' + now;
        }
      }
    }, true);
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
